<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="page for the user see information on how to contact the company">
    <meta name="author" content="Gabriel Guilherme Dos Santos Corrêa">
    <title>Contat Us</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600&display=swap"
      rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/raft-logo.png" alt="Logo for the rafting company">
        <nav>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="trips.html">Trips</a></li>
            <li><a href="contact.html">Contact Us</a></li>
        </nav>
    </header>

    <main class="title-info">
        <div class="true-info">
            <h1>Ultra Raft Adventures</h1>
            <p>234 Palm Tree Street</p>
            <p>Mount Castle, Virginia</p>
            <p>+1 555 555 555</p>
            <p>info@ultraraft.com</p>
        </div>
        <div class="contact-section">
            <div class="map-box">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d30193.90841986817!2d-77.19252240306855!3d37.30120851974143!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sbr!4v1780704805131!5m2!1sen!2sbr"
                  width="300" height="225" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>

            <form>
                <div class="form-info">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">
                </div>

                <div class="form-info">
                    <label for="email">Email</label>
                    <input type="text" id="email" name="email">
                </div>

                <div class="form-info">
                    <div class="radio-group">
                        <p>Message purpose</p>
                        <div class="radio-options">
                            <label>
                                <input type="radio" name="option" value="inquiry">General Inquiry
                            </label>

                            <label>
                                <input type="radio" name="option" value="reservation">Reservation
                                Question
                            </label>

                            <label>
                                <input type="radio" name="option" value="website">Website Suggestion
                            </label>
                        </div>
                    </div>
                </div>
                <div class="form-info">
                    <label for="message">Message</label>
                    <textarea name="message" id="message"></textarea>
                </div>

                <div class="form-info">
                    <label for="checkbox">
                        <input type="checkbox" name="option1" id="op1"> Please Subscribe me to
                        the monthyly newsletter
                    </label>
                </div>

                <button type="submit">Get In Touch</button>
        </div>
        </form>

        </div>


        <section class="bottom-title">
            <h2>We Are Here To Serve You</h2>
            <div class="grid-card">
                <figure class="employe">
                    <img src="images/brian nd.jpg" alt="brian">
                    <figcaption>Brian</figcaption>
                </figure>
                <figure class="employe">
                    <img src="images/lucas nd.jpg" alt="lucas">
                    <figcaption>Lucas</figcaption>
                </figure>
                <figure class="employe">
                    <img src="images/maria nd.jpg" alt="maria">
                    <figcaption>Maria</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>© 2026 | Ultra Raft Adventures | Gabriel Guilherme Dos Santos Corrêa</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook-logo.png"
                  alt="facebook icon"></a>

            <a href="https://linkedin.com"><img src="images/linkedin-logo.png"
                  alt="linkedin icon"></a>
            <a href="https://instagram.com"><img src="images/instagram-logo.png"
                  alt="instagram icon"></a>
        </nav>
    </footer>
</body>

</html>
